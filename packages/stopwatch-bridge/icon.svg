<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="StopWatch bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7BFF"/>
      <stop offset="1" stop-color="#3448D6"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- watch crown -->
  <rect x="58" y="4" width="12" height="10" rx="3" fill="#DCE4FF"/>
  <rect x="61" y="12" width="6" height="6" rx="2" fill="#AFC0FF"/>
  <!-- chubby whale body -->
  <ellipse cx="62" cy="72" rx="34" ry="27" fill="#FFFFFF"/>
  <!-- tail -->
  <path d="M29 66 C17 54 15 47 16 43 C23 47 29 50 34 55 Z" fill="#FFFFFF"/>
  <path d="M29 78 C16 82 12 89 12 94 C20 91 27 88 33 84 Z" fill="#FFFFFF"/>
  <!-- belly -->
  <ellipse cx="66" cy="83" rx="24" ry="13" fill="#DCE4FF"/>
  <!-- fin -->
  <path d="M52 84 C48 94 52 99 60 96 Z" fill="#C7D4FF"/>
  <!-- eye -->
  <circle cx="76" cy="64" r="4.2" fill="#1B2A6B"/>
  <circle cx="77.4" cy="62.6" r="1.4" fill="#FFFFFF"/>
  <!-- blush -->
  <ellipse cx="84" cy="74" rx="4.6" ry="3" fill="#FFB4C8" opacity="0.9"/>
  <!-- smile -->
  <path d="M70 76 q5 5 9 1" stroke="#1B2A6B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- spout -->
  <path d="M52 42 q-6 -9 0 -14 q6 -5 0 -13" stroke="#CFE0FF" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.95"/>
  <circle cx="43" cy="38" r="3.2" fill="#CFE0FF"/>
  <circle cx="61" cy="34" r="2.4" fill="#CFE0FF"/>
  <!-- alert ring -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="#8FA8FF" stroke-width="2" stroke-dasharray="10 14" opacity="0.55"/>
</svg>
